<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #22d3ee;
        --snake: #4ade80;
        --food: #f97316;
        --text: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        color: var(--text);
      }

      .container {
        width: min(92vw, 560px);
        padding: 1rem;
        background: color-mix(in oklab, var(--panel), black 5%);
        border: 1px solid color-mix(in oklab, var(--panel), white 12%);
        border-radius: 16px;
        box-shadow: 0 16px 40px rgb(2 6 23 / 35%);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .stats {
        display: flex;
        gap: 0.5rem;
        font-size: 0.95rem;
      }

      .pill {
        padding: 0.35rem 0.6rem;
        border-radius: 999px;
        background: color-mix(in oklab, var(--panel), white 10%);
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 0.55rem 0.9rem;
        background: var(--accent);
        color: #022c22;
        font-weight: 700;
        cursor: pointer;
      }

      .board-wrap {
        position: relative;
      }

      canvas {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        background: #020617;
        border-radius: 12px;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        text-align: center;
        padding: 1rem;
        font-weight: 700;
        color: #f8fafc;
        text-shadow: 0 2px 8px rgb(2 6 23 / 70%);
      }

      .hint {
        margin-top: 0.8rem;
        font-size: 0.9rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="header">
        <h1>Snake</h1>
        <div class="stats">
          <span class="pill">Score: <strong id="score">0</strong></span>
          <span class="pill">High: <strong id="highScore">0</strong></span>
        </div>
        <button id="restartButton" type="button">Restart</button>
      </section>

      <section class="board-wrap">
        <canvas id="gameCanvas" width="600" height="600" aria-label="Snake game"></canvas>
        <div id="overlay" class="overlay">Press any arrow key or WASD to start.</div>
      </section>
      <p class="hint">Controls: Arrow Keys or WASD. Press Space to pause.</p>
    </main>

    <script>
      const boardSize = 20;
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const highScoreEl = document.getElementById('highScore');
      const overlay = document.getElementById('overlay');
      const restartButton = document.getElementById('restartButton');

      let snake;
      let direction;
      let pendingDirection;
      let food;
      let score;
      let gameLoop;
      let speed;
      let started;
      let paused;
      const highScoreKey = 'snake-high-score';

      function resetGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        direction = { x: 1, y: 0 };
        pendingDirection = { ...direction };
        food = randomOpenCell();
        score = 0;
        speed = 130;
        started = false;
        paused = false;
        scoreEl.textContent = score;
        overlay.textContent = 'Press any arrow key or WASD to start.';
        clearInterval(gameLoop);
        gameLoop = null;
        draw();
      }

      function getHighScore() {
        return Number(localStorage.getItem(highScoreKey) || 0);
      }

      function setHighScore(value) {
        localStorage.setItem(highScoreKey, String(value));
        highScoreEl.textContent = value;
      }

      function randomOpenCell() {
        while (true) {
          const next = {
            x: Math.floor(Math.random() * boardSize),
            y: Math.floor(Math.random() * boardSize),
          };
          if (!snake.some((cell) => cell.x === next.x && cell.y === next.y)) {
            return next;
          }
        }
      }

      function startLoop() {
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, speed);
      }

      function tick() {
        direction = pendingDirection;
        const head = snake[0];
        const next = { x: head.x + direction.x, y: head.y + direction.y };

        const outOfBounds =
          next.x < 0 || next.x >= boardSize || next.y < 0 || next.y >= boardSize;
        const hitSelf = snake.some((cell) => cell.x === next.x && cell.y === next.y);

        if (outOfBounds || hitSelf) {
          gameOver();
          return;
        }

        snake.unshift(next);

        if (next.x === food.x && next.y === food.y) {
          score += 1;
          scoreEl.textContent = score;
          food = randomOpenCell();
          if (speed > 70) {
            speed -= 3;
            startLoop();
          }
        } else {
          snake.pop();
        }

        draw();
      }

      function drawGrid() {
        const cell = canvas.width / boardSize;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.13)';
        ctx.lineWidth = 1;
        for (let i = 1; i < boardSize; i += 1) {
          const p = i * cell;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(canvas.width, p);
          ctx.stroke();
        }
      }

      function drawCell(x, y, color, radius = 0.2) {
        const cell = canvas.width / boardSize;
        const size = cell * 0.9;
        const gap = (cell - size) / 2;
        const px = x * cell + gap;
        const py = y * cell + gap;

        ctx.fillStyle = color;
        ctx.beginPath();
        const corner = size * radius;
        ctx.roundRect(px, py, size, size, corner);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        drawCell(food.x, food.y, '#f97316', 0.45);

        snake.forEach((segment, index) => {
          const shade = index === 0 ? '#22c55e' : '#4ade80';
          drawCell(segment.x, segment.y, shade, 0.25);
        });
      }

      function gameOver() {
        clearInterval(gameLoop);
        gameLoop = null;

        const best = Math.max(score, getHighScore());
        if (best !== getHighScore()) {
          setHighScore(best);
        }

        overlay.textContent = `Game over! Score: ${score}. Press restart to play again.`;
      }

      function setDirection(next) {
        if (!started) {
          started = true;
          overlay.textContent = '';
          startLoop();
        }

        const reverse = direction.x + next.x === 0 && direction.y + next.y === 0;
        if (!reverse) {
          pendingDirection = next;
        }
      }

      function togglePause() {
        if (!started || !gameLoop) return;
        paused = !paused;

        if (paused) {
          clearInterval(gameLoop);
          gameLoop = null;
          overlay.textContent = 'Paused — press Space to resume.';
        } else {
          overlay.textContent = '';
          startLoop();
        }
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();

        if (key === ' ') {
          event.preventDefault();
          togglePause();
          return;
        }

        const mapping = {
          arrowup: { x: 0, y: -1 },
          w: { x: 0, y: -1 },
          arrowdown: { x: 0, y: 1 },
          s: { x: 0, y: 1 },
          arrowleft: { x: -1, y: 0 },
          a: { x: -1, y: 0 },
          arrowright: { x: 1, y: 0 },
          d: { x: 1, y: 0 },
        };

        if (mapping[key]) {
          event.preventDefault();
          if (paused) {
            togglePause();
          }
          setDirection(mapping[key]);
        }
      });

      restartButton.addEventListener('click', () => {
        const best = Math.max(score, getHighScore());
        setHighScore(best);
        resetGame();
      });

      highScoreEl.textContent = getHighScore();
      resetGame();
    </script>
  </body>
</html>
